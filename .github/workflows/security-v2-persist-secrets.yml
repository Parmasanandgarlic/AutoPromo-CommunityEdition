name: Security V2 Renderer Persistence Remediation
on:
  push:
    branches: [agent/security-v2-audit]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/security-v2-audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Remove renderer secret persistence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/tool/App.tsx')
          s=p.read_text()
          old="""  const [advancedConfig, setAdvancedConfig] = useState(() => {
    const saved = localStorage.getItem('advancedConfig');
    const parsed = saved ? JSON.parse(saved) : {};
    return {
"""
          new="""  const [advancedConfig, setAdvancedConfig] = useState(() => {
    const saved = localStorage.getItem('advancedConfig');
    const parsed = saved ? JSON.parse(saved) : {};
    // Credentials from older builds may exist in browser storage. Discard them
    // before state is constructed so a renderer compromise cannot recover them.
    delete parsed.proxyPass;
    delete parsed.twitterProxyPass;
    delete parsed.aiApiKey;
    return {
"""
          if old not in s: raise SystemExit('advancedConfig initializer not found')
          s=s.replace(old,new,1)
          oldsave="  useEffect(() => { localStorage.setItem('advancedConfig', JSON.stringify(advancedConfig)); }, [advancedConfig]);"
          newsave="""  useEffect(() => {
    const { proxyPass: _proxyPass, twitterProxyPass: _twitterProxyPass, aiApiKey: _aiApiKey, ...persistable } = advancedConfig;
    localStorage.setItem('advancedConfig', JSON.stringify(persistable));
  }, [advancedConfig]);"""
          if oldsave not in s: raise SystemExit('advancedConfig persistence effect not found')
          s=s.replace(oldsave,newsave,1)
          p.write_text(s)
          PY
      - name: Validate application
        run: |
          npm ci
          npm run lint
          npm test -- --runInBand || npm test
          npm run build
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - name: Persist validated source only
        shell: bash
        run: |
          git config user.name 'security-remediation-bot'
          git config user.email 'security-remediation-bot@users.noreply.github.com'
          git add src/tool/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'security: stop persisting renderer credentials'
          git push origin HEAD:agent/security-v2-audit
