name: One-shot provenance cleanup

on:
  push:
    branches: [portfolio/engineering-quality]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/engineering-quality
          fetch-depth: 0
      - name: Replace legacy generator instruction
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/tool/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'To run on Windows: 1. Export to ZIP (AI' + ' Studio menu) 2. Extract 3. Run "build_installer.bat" inside.'
          new = 'To build the Windows app locally, install dependencies and run "npm run electron:build:win".'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one legacy generator instruction, found {count}.')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Remove this one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/one-shot-provenance-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/tool/App.tsx .github/workflows/one-shot-provenance-cleanup.yml
          git commit -m "chore: remove AI Studio provenance instruction"
          git push origin HEAD:portfolio/engineering-quality
