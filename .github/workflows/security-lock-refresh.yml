name: Security Lockfile Refresh
on:
  push:
    branches: [agent/portfolio-security-audit]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/portfolio-security-audit}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run build:server
      - run: npm run build:electron
      - name: Reject high/critical advisories across desktop and production graph
        run: npm audit --audit-level=high
      - name: Commit verified lockfile only
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'security-lockfile-bot'
          git config user.email 'security-lockfile-bot@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'security: refresh patched desktop dependency lockfile'
          git push origin HEAD:agent/portfolio-security-audit
