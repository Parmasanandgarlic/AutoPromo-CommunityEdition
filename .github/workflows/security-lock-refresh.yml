name: Security Lockfile Refresh
on:
  push:
    branches: [agent/portfolio-security-audit]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/portfolio-security-audit}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Synchronize lockfile with desktop dependency changes
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify synchronized graph installs
        run: npm ci
      - name: Persist synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already synchronized.'
          else
            git config user.name 'security-lockfile-bot'
            git config user.email 'security-lockfile-bot@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'security: synchronize desktop dependency lockfile'
            git push origin HEAD:agent/portfolio-security-audit
          fi
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run build:server
      - run: npm run build:electron
      - name: Reject high/critical advisories across desktop and production graph
        run: npm audit --audit-level=high
